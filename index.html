<html>
  <head>
    <link rel="stylesheet" href="styles.css"/>
    <script src="script.js" defer></script>
  </head>
  <main>
    <input id="search-input" required/>
    <button id="search-button">Search</button>
    </br>
    <h1><span id="creature-name"></span><span id="creature-id"></span></h1>
    <span id="weight"></span>
    <span id="height"></span>
    <span id="types"></span>
    <table>
      <tbody>
        <tr>
          <td><b>Base</b></td>
          <td><b>Stats</b></td>
        </tr>
        <tr>
          <td>HP:</td>
          <td id="hp"></td>
        </tr>
        <tr>
          <td>Attack:</td>
          <td id="attack"></td>
        </tr>
        <tr>
          <td>Defense:</td>
          <td id="defense"></td>
        </tr>
        <tr>
          <td>Sp. Attack:</td>
          <td id="special-attack"></td>
        </tr>
        <tr>
          <td>Sp. Defense:</td>
          <td id="special-defense"></td>
        </tr>
        <tr>
          <td>Speed:</td>
          <td id="speed"></td>
        </tr>
      </tbody>
    </table>
    
  </main>
</html>
